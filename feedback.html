<script>
$(document).ready(function(){
		var test_id  = $('input[name="test_id"]').val();
		// $('#modalhidden').val(material_id);
				$.ajax({
				method: "POST",
				url: "../getFeedback.php",
				dataType: "json",
				data: { from:"prelimsFeedback", test_id: test_id},
				success: function(result){
					if(result.status == '1' && result.data.rating_d !=0 && result.data.rating_q !=0){
						$("#rating_q"+result.data.rating_q).prop("checked", true);
						$("#rating_d"+result.data.rating_d).prop("checked", true);
						$("#feedbackData").text(result.data.feedback);
						$('#rating_q1').attr("disabled", 'disabled');
						$('#rating_q2').attr("disabled", 'disabled');
						$('#rating_q3').attr("disabled", 'disabled');
						$('#rating_q4').attr("disabled", 'disabled');
						$('#rating_q5').attr("disabled", 'disabled');

						$('#rating_d3').attr("disabled", 'disabled');
						$('#rating_d4').attr("disabled", 'disabled');
						$('#rating_d5').attr("disabled", 'disabled');
						$("#feedbackData").attr("disabled", 'disabled');
						$("input[name='Submit1']").attr("disabled", 'disabled');
				}
			}
			})
});
</script>
